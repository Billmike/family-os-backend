services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyos
      POSTGRES_PASSWORD: familyos
      POSTGRES_DB: familyos
    ports:
      - "5435:5432"
    volumes:
      - familyos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyos -d familyos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://familyos:familyos@db:5432/familyos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
    volumes:
      # Bind-mount source so --reload picks up local edits without a rebuild
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    # PATH includes /app/.venv/bin from the image; do not COPY host .venv into the image
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

volumes:
  familyos_pg:
