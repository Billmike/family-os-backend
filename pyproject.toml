[project]
name = "familyos-api"
version = "0.1.0"
description = "FamilyOS Family API — household coordination backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.4.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
